name: EconPlanner pull-request tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: econplanner-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  ECONOMICS_PROPERTY_MODE: small
  PDF_CREATION_ENABLED: "false"

jobs:
  deterministic:
    name: Deterministic policy, oracle, and planner tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and verify the deterministic policy bundle
        run: >-
          node --test
          tests/policy-hub-schema.test.js
          tests/policy-compiler.test.js
          tests/policy-bundle-determinism.test.js
          tests/policy-source-bundle-parity.test.js
          tests/policy-compatibility-generation.test.js
          tests/policy-source-to-bundle.test.js
          tests/production-decision-engine.test.js
          tests/decision-engine-shadow.test.js
          tests/decision-engine-oracle-differential.test.js
          tests/architecture-boundaries.test.js

      - name: Run canonical consumption repair regressions
        run: node --test tests/canonical-consumption-repairs.test.js tests/schedule-correction-2027.test.js tests/requested-behaviors.test.js

      - name: Run bounded deterministic regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/deterministic
          node --test \
            tests/economics-policy-manifest.test.js \
            tests/economics-schedule-drift.test.js \
            tests/economics-independent-oracle-structure.test.js \
            tests/economics-oracle-requirements.test.js \
            tests/economics-oracle-prerequisites.test.js \
            tests/economics-oracle-schedule-capacity.test.js \
            tests/economics-core-profiles.test.js \
            tests/economics-prerequisite-edge-matrix.test.js \
            tests/economics-requirement-allocation-matrix.test.js \
            tests/economics-validator-disagreements.test.js \
            tests/economics-generators.test.js \
            tests/economics-properties.test.js \
            tests/economics-strategy-ranking.test.js \
            tests/economics-candidate-pools.test.js \
            tests/economics-planning.test.js \
            tests/economics-plan-editing-api.test.js \
            tests/offering-policy-consistency.test.js \
            tests/economics-move-matrix.test.js \
            tests/major-api.test.js \
            tests/economics-report.test.js \
            tests/economics-report-parity.test.js \
            2>&1 | tee test-results/deterministic/regression.log

      - name: Validate fictional PDF fixtures without a hosted service
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify:pdf:economics -- --dry-run \
            2>&1 | tee test-results/deterministic/pdf-dry-run.log

      - name: Upload deterministic failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-failure-evidence
          path: |
            test-results/deterministic/
            output/economics-pdf-verification/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser accessibility and adversarial tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_PORT: 3100
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chrome and operating-system dependencies
        run: pnpm exec playwright install --with-deps chrome

      - name: Install local PDF text verification
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Run bounded EconPlanner browser regression suite
        run: >-
          pnpm exec playwright test
          tests/e2e/econ-planner-accessibility.spec.js
          tests/e2e/econ-planner.spec.js
          tests/e2e/architecture-repairs.spec.js
          tests/e2e/course-moves.spec.js
          tests/e2e/requested-behaviors.spec.js

      - name: Run targeted PDF-lock and malformed-response regressions
        run: >-
          pnpm exec playwright test
          tests/e2e/econ-planner.spec.js
          --grep
          "PDF download recovers cleanly after failed and aborted requests|a structurally malformed successful planner response is rejected before storage"

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build production application
        run: pnpm run build
