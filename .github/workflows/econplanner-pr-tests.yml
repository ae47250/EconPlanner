name: EconPlanner pull-request tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: econplanner-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  ECONOMICS_PROPERTY_MODE: small
  PDF_CREATION_ENABLED: "false"

jobs:
  deterministic-suite:
    name: Deterministic regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile and verify the deterministic policy bundle
        run: >-
          node --test
          tests/policy-hub-schema.test.js
          tests/policy-compiler.test.js
          tests/policy-bundle-determinism.test.js
          tests/policy-source-bundle-parity.test.js
          tests/policy-compatibility-generation.test.js
          tests/policy-source-to-bundle.test.js
          tests/production-decision-engine.test.js
          tests/decision-engine-oracle-differential.test.js
          tests/architecture-boundaries.test.js

      - name: Run canonical consumption repair regressions
        run: node --test tests/canonical-consumption-repairs.test.js tests/schedule-correction-2027.test.js tests/requested-behaviors.test.js tests/major-checklist-presentation.test.js tests/plan-notes-elective-evidence.test.js tests/economics-owner-panel-decisions.test.js tests/historical-prerequisite-language.test.js

      - name: Run bounded deterministic regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results/deterministic
          node --test \
            tests/economics-policy-manifest.test.js \
            tests/economics-schedule-drift.test.js \
            tests/economics-independent-oracle-structure.test.js \
            tests/economics-oracle-requirements.test.js \
            tests/economics-oracle-prerequisites.test.js \
            tests/economics-oracle-schedule-capacity.test.js \
            tests/economics-core-profiles.test.js \
            tests/economics-prerequisite-edge-matrix.test.js \
            tests/economics-requirement-allocation-matrix.test.js \
            tests/economics-validator-disagreements.test.js \
            tests/economics-generators.test.js \
            tests/economics-properties.test.js \
            tests/economics-strategy-ranking.test.js \
            tests/plan-ranking-rules.test.js \
            tests/economics-candidate-pools.test.js \
            tests/economics-extra-courses.test.js \
            tests/economics-planning.test.js \
            tests/economics-plan-editing-api.test.js \
            tests/economics-replacement-moves.test.js \
            tests/student-facing-language.test.js \
            tests/move-advice-codes.test.js \
            tests/planner-session-restoration.test.js \
            tests/offering-policy-consistency.test.js \
            tests/ci-move-matrix-coverage.test.js \
            tests/major-api.test.js \
            tests/economics-report.test.js \
            tests/economics-report-parity.test.js \
            tests/academic-calendar-policy.test.js \
            tests/accelerated-result.test.js \
            tests/assignment.test.js \
            tests/catalog-comparison.test.js \
            tests/catalog-ingestion.test.js \
            tests/economics-only-catalog.test.js \
            tests/catalog-planning-note.test.js \
            tests/cp4b-a-contracts.test.js \
            tests/cp4b-b-contracts.test.js \
            tests/cp5-bounded-reference.test.js \
            tests/cp5a-plan-coverage.test.js \
            tests/dsl.test.js \
            tests/economics-planning-profile-matrix.test.js \
            tests/economics-schedule.test.js \
            tests/finance-elective-correction.test.js \
            tests/graduation-first-planning.test.js \
            tests/graduation-solver-architecture.test.js \
            tests/mcp-handoff.test.js \
            tests/n1-independent-infeasibility.test.js \
            tests/no-plan-result.test.js \
            tests/pdf-creation-client.test.js \
            tests/plan-strategies-availability.test.js \
            tests/planner-ui-state.test.js \
            tests/planning-distribution.test.js \
            tests/planning-horizon.test.js \
            tests/planning-input-boundaries.test.js \
            tests/planning-strategy-eligibility.test.js \
            tests/preliminary-schedule.test.js \
            tests/prerequisite-validation.test.js \
            tests/requirement-allocation.test.js \
            2>&1 | tee test-results/deterministic/regression.log

      - name: Run move-matrix companion regressions
        run: node --test --test-skip-pattern="course-to-term move matrix" tests/economics-move-matrix.test.js

      - name: Validate fictional PDF fixtures without a hosted service
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify:pdf:economics -- --dry-run \
            2>&1 | tee test-results/deterministic/pdf-dry-run.log

      - name: Upload deterministic failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-failure-evidence
          path: |
            test-results/deterministic/
            output/economics-pdf-verification/
          if-no-files-found: ignore
          retention-days: 7

  browser-shards:
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_PORT: 3100
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chrome and operating-system dependencies
        run: pnpm exec playwright install --with-deps chrome

      - name: Install local PDF text verification
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Exercise student panel self-tests
        if: matrix.shard == 1
        run: node --test tests/panel/panel-self-test.test.js tests/panel/panel-review-regressions.test.js tests/panel/panel-study-abroad.test.js

      - name: Build application for student panel
        if: matrix.shard == 1
        run: pnpm run build

      - name: Check student panel snapshots
        if: matrix.shard == 1
        run: pnpm panel:check

      - name: Report student panel lint findings
        if: always() && matrix.shard == 1
        run: pnpm panel:lint

      - name: Run bounded EconPlanner browser regression suite
        run: >-
          pnpm exec playwright test
          tests/e2e/econ-planner-accessibility.spec.js
          tests/e2e/econ-planner.spec.js
          tests/e2e/architecture-repairs.spec.js
          tests/e2e/course-moves.spec.js
          tests/e2e/requested-behaviors.spec.js
          tests/e2e/pdf-wording.spec.js
          tests/e2e/plan-notes-evidence.spec.js
          tests/e2e/summer-last-resort-note.spec.js
          tests/e2e/econ-planner-parity.spec.js
          tests/e2e/finance-elective-correction.spec.js
          --fully-parallel --workers=1 --shard=${{ matrix.shard }}/4

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  move-matrix:
    name: Move matrix (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Exercise every move in the selected profiles
        env:
          ECONOMICS_MOVE_MATRIX_SHARD: ${{ matrix.shard }}
          ECONOMICS_MOVE_MATRIX_REPORT: move-matrix-${{ matrix.shard }}.json
        run: node --test --test-name-pattern="course-to-term move matrix" tests/economics-move-matrix.test.js
      - name: Upload coverage for the combined gate
        uses: actions/upload-artifact@v7
        with:
          name: move-matrix-${{ matrix.shard }}
          path: move-matrix-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  # Preserve the original check names; skipped or failed dependencies must fail.
  deterministic:
    name: Deterministic policy, oracle, and planner tests
    if: always()
    needs: [deterministic-suite, move-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all deterministic jobs to succeed
        env:
          SUITE_RESULT: ${{ needs.deterministic-suite.result }}
          MATRIX_RESULT: ${{ needs.move-matrix.result }}
        run: test "$SUITE_RESULT" = success && test "$MATRIX_RESULT" = success
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: move-matrix-*
          path: move-matrix-coverage
          merge-multiple: true
      - name: Verify combined profile and move coverage
        run: node scripts/ci/move-matrix-coverage.mjs move-matrix-coverage/*.json

  browser:
    name: Browser accessibility and adversarial tests
    if: always()
    needs: browser-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all four browser shards to succeed
        env:
          RESULT: ${{ needs.browser-shards.result }}
        run: test "$RESULT" = success

  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build production application
        run: pnpm run build
