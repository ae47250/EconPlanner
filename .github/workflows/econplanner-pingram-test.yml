name: EconPlanner Pingram notification test

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Notification channel to test
        required: true
        type: choice
        options:
          - email
          - sms
          - both
        default: email

permissions:
  contents: read

jobs:
  send-test-notification:
    name: Send Pingram ${{ inputs.channel }} test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          install: false

      - name: Send Pingram test notification
        env:
          PINGRAM_TEST_CHANNEL: ${{ inputs.channel }}
          PINGRAM_API_KEY: ${{ secrets.PINGRAM_API_KEY }}
          PINGRAM_API_URL: ${{ secrets.PINGRAM_API_URL }}
          PINGRAM_FROM_EMAIL: ${{ secrets.PINGRAM_FROM_EMAIL }}
          PINGRAM_FROM_NAME: ${{ secrets.PINGRAM_FROM_NAME }}
          PINGRAM_REPLY_TO: ${{ secrets.PINGRAM_REPLY_TO }}
          ECONPLANNER_NOTIFICATION_EMAIL: ${{ secrets.ECONPLANNER_NOTIFICATION_EMAIL }}
          ECONPLANNER_NOTIFICATION_SUBJECT_PREFIX: ${{ vars.ECONPLANNER_NOTIFICATION_SUBJECT_PREFIX }}
          PINGRAM_TEST_PHONE: ${{ secrets.PINGRAM_TEST_PHONE }}
        run: node scripts/test-pingram-notification.mjs
