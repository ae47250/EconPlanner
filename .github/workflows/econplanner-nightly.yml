name: EconPlanner nightly tests

on:
  workflow_dispatch:
  schedule:
    # 07:17 UTC is approximately 2:17 AM EST or 3:17 AM EDT.
    - cron: "17 7 * * *"

permissions:
  contents: read

concurrency:
  group: econplanner-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  PDF_CREATION_ENABLED: "false"

jobs:
  generated-matrix:
    name: Generated profiles (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fixed-seed fictional profile shard
        run: >-
          node scripts/run-economics-nightly-matrix.mjs
          --shard ${{ matrix.shard }}/4
          --output test-results/economics-nightly-matrix/shard-${{ matrix.shard }}.json

      - name: Upload generated-profile metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-profile-metrics-shard-${{ matrix.shard }}
          path: test-results/economics-nightly-matrix/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated-profile failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generated-profile-failures-shard-${{ matrix.shard }}
          path: test-results/economics-nightly-matrix/shard-${{ matrix.shard }}.failures.json
          if-no-files-found: ignore
          retention-days: 14

  deterministic:
    name: Exhaustive policy, oracle, mutation, and planner tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run normal 336-case prerequisite matrix
        shell: bash
        env:
          ECONOMICS_PREREQUISITE_MATRIX_REPORT: "1"
        run: |
          set -o pipefail
          mkdir -p test-results/nightly-deterministic
          node --test tests/economics-prerequisite-edge-matrix.test.js \
            2>&1 | tee test-results/nightly-deterministic/prerequisite-normal.log

      - name: Run corrected optional 293-case prerequisite matrix
        shell: bash
        env:
          ECONOMICS_PREREQUISITE_MATRIX_NIGHTLY: "1"
          ECONOMICS_PREREQUISITE_MATRIX_REPORT: "1"
        run: |
          set -o pipefail
          node --test \
            --test-name-pattern "nightly-only prerequisite subset" \
            tests/economics-prerequisite-edge-matrix.test.js \
            2>&1 | tee test-results/nightly-deterministic/prerequisite-optional.log

      - name: Run allocation, approval identity, and exhaustive mutation matrices
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/economics-policy-manifest.test.js \
            tests/economics-schedule-drift.test.js \
            tests/economics-independent-oracle-structure.test.js \
            tests/economics-oracle-requirements.test.js \
            tests/economics-oracle-prerequisites.test.js \
            tests/economics-oracle-schedule-capacity.test.js \
            tests/economics-requirement-allocation-matrix.test.js \
            tests/economics-validator-disagreements.test.js \
            tests/economics-plan-editing-api.test.js \
            tests/major-api.test.js \
            tests/economics-report.test.js \
            tests/economics-report-parity.test.js \
            2>&1 | tee test-results/nightly-deterministic/exhaustive-matrices.log

      - name: Record 629-case prerequisite summary
        run: >-
          node scripts/run-economics-nightly-matrix.mjs
          --summarize-prerequisites
          --normal-log test-results/nightly-deterministic/prerequisite-normal.log
          --optional-log test-results/nightly-deterministic/prerequisite-optional.log
          --output test-results/nightly-deterministic/prerequisite-summary.json

      - name: Upload prerequisite-matrix metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-prerequisite-matrix-metrics
          path: test-results/nightly-deterministic/prerequisite-summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Run large fixed-seed property combinations
        shell: bash
        env:
          ECONOMICS_PROPERTY_MODE: nightly
        run: |
          set -o pipefail
          node --test tests/economics-properties.test.js \
            2>&1 | tee test-results/nightly-deterministic/properties.log

      - name: Repeat deterministic ranking and candidate-pool checks
        shell: bash
        run: |
          set -o pipefail
          for repetition in 1 2 3; do
            node --test \
              tests/economics-strategy-ranking.test.js \
              tests/economics-candidate-pools.test.js \
              2>&1 | tee "test-results/nightly-deterministic/ranking-${repetition}.log"
          done

      - name: Run complete unit regression suite
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-results/nightly-deterministic/full-unit.log

      - name: Validate fictional report and PDF projections without a hosted service
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify:pdf:economics -- --dry-run \
            2>&1 | tee test-results/nightly-deterministic/pdf-dry-run.log

      - name: Upload deterministic failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-deterministic-failure-evidence
          path: |
            test-results/nightly-deterministic/
            output/economics-pdf-verification/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Repeated browser, accessibility, and adversarial tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chrome and operating-system dependencies
        run: pnpm exec playwright install --with-deps chrome

      - name: Run the full browser suite three times on fresh servers
        shell: bash
        run: |
          mkdir -p test-results/nightly-browser
          overall=0
          for repetition in 1 2 3; do
            export PLAYWRIGHT_PORT="$((3200 + repetition))"
            export PLAYWRIGHT_JSON_OUTPUT_NAME="test-results/nightly-browser/run-${repetition}.json"
            pnpm exec playwright test \
              --reporter=list,json \
              --output "test-results/nightly-browser/run-${repetition}" \
              2>&1 | tee "test-results/nightly-browser/run-${repetition}.log"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          node scripts/run-economics-nightly-matrix.mjs \
            --summarize-playwright \
            --input test-results/nightly-browser/run-1.json \
            --input test-results/nightly-browser/run-2.json \
            --input test-results/nightly-browser/run-3.json \
            --output test-results/nightly-browser/summary.json
          summary_status=$?
          if [ "$summary_status" -ne 0 ]; then overall=1; fi
          exit "$overall"

      - name: Upload browser metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-browser-metrics
          path: test-results/nightly-browser/summary.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-browser-failure-evidence
          path: |
            test-results/nightly-browser/**/*.zip
            test-results/nightly-browser/**/*.png
            test-results/nightly-browser/**/*.webm
            test-results/nightly-browser/**/error-context.md
            test-results/nightly-browser/run-*.log
            test-results/nightly-browser/run-*.json
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Lint, build, and repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build production application
        run: pnpm run build

      - name: Check whitespace and patch hygiene
        run: git diff --check

  hosted-pdf:
    name: Optional hosted PDF contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node and pnpm
        uses: pnpm/setup@v1
        with:
          version: 11.9.0
          runtime: node@24.18.0
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove the live verifier safely skips without credentials
        shell: bash
        env:
          PDF_CREATION_ENABLED: "false"
          PDF_CREATION_API_URL: ""
          PDF_CREATION_API_KEY: ""
          PDF_CREATION_BYPASS_TOKEN: ""
        run: |
          mkdir -p test-results/nightly-pdf
          pnpm run verify:pdf:economics -- --live \
            2>&1 | tee test-results/nightly-pdf/safe-skip.log

      - name: Detect hosted PDF credentials without exposing them
        id: pdf-credentials
        shell: bash
        env:
          ENABLED: ${{ secrets.PDF_CREATION_ENABLED }}
          API_URL: ${{ secrets.PDF_CREATION_API_URL }}
          API_KEY: ${{ secrets.PDF_CREATION_API_KEY }}
        run: |
          if [ "$ENABLED" = "true" ] && [ -n "$API_URL" ] && [ -n "$API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Poppler for the hosted PDF contract only
        if: steps.pdf-credentials.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Run hosted PDF contract with fictional fixtures
        if: steps.pdf-credentials.outputs.configured == 'true'
        shell: bash
        env:
          PDF_CREATION_ENABLED: ${{ secrets.PDF_CREATION_ENABLED }}
          PDF_CREATION_API_URL: ${{ secrets.PDF_CREATION_API_URL }}
          PDF_CREATION_API_KEY: ${{ secrets.PDF_CREATION_API_KEY }}
          PDF_CREATION_BYPASS_TOKEN: ${{ secrets.PDF_CREATION_BYPASS_TOKEN }}
        run: |
          set -o pipefail
          pnpm run verify:pdf:economics -- --live \
            2>&1 | tee test-results/nightly-pdf/live-contract.log

      - name: Record safe hosted-PDF skip
        if: steps.pdf-credentials.outputs.configured != 'true'
        run: echo "Hosted PDF contract skipped because the required GitHub secrets are unavailable." > test-results/nightly-pdf/hosted-result.txt

      - name: Upload hosted-PDF result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-hosted-pdf-result
          path: |
            test-results/nightly-pdf/
          if-no-files-found: error
          retention-days: 14

      - name: Upload hosted-PDF failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-hosted-pdf-failure-evidence
          path: output/economics-pdf-verification/
          if-no-files-found: ignore
          retention-days: 14
