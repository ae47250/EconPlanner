<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EconMapper</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --planner-max-width: 880px;
      --planner-border: #d7d7d7;
      --planner-muted: #666;
      --planner-bg: #fafafa;
    }

    body {
      background: var(--planner-bg);
    }

    main.container {
      max-width: var(--planner-max-width);
      padding-top: 2rem;
      padding-bottom: 3rem;
    }

    .hero {
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .hero p {
      max-width: 680px;
      margin-inline: auto;
      color: var(--planner-muted);
    }

    .planner-card,
    .result-card,
    .year-card,
    .note-card {
      border: 1px solid var(--planner-border);
      border-radius: 1rem;
      background: #fff;
      box-shadow: none;
    }

    .planner-card {
      padding: 1.4rem;
    }

    .form-grid {
      display: grid;
      gap: 1rem;
    }

    .two-col {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 720px) {
      .two-col {
        grid-template-columns: 1fr 1fr;
      }
    }

    textarea {
      min-height: 9rem;
      resize: vertical;
    }

    .submit-row {
      margin-top: 1.25rem;
    }

    .submit-row button {
      width: 100%;
    }

    #status {
      margin-top: 1rem;
      color: var(--planner-muted);
      min-height: 1.5rem;
    }

    #results {
      margin-top: 1.5rem;
    }

    .result-card {
      padding: 1.25rem;
    }

    .summary-card {
      border: 1px solid var(--planner-border);
      border-radius: 0.9rem;
      padding: 1rem;
      background: #fff;
      margin-bottom: 1rem;
    }

    .summary-card p {
      margin-bottom: 0.45rem;
    }

    .summary-card p:last-child {
      margin-bottom: 0;
    }

    .year-card {
      padding: 1rem;
      margin-top: 1rem;
    }

    .year-card h3 {
      margin-bottom: 0.75rem;
      text-align: center;
    }

    table {
      margin-bottom: 0;
    }

    th, td {
      text-align: center;
      vertical-align: top;
    }

    .note-card {
      padding: 0.85rem 1rem;
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: #333;
    }

    .note-card p:last-child {
      margin-bottom: 0;
    }

    .small-muted {
      color: var(--planner-muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>EconMapper</h1>
      <p>Build a possible economics major course plan. This tool is not a replacement for advisor confirmation.</p>
    </header>

    <article class="planner-card">
      <form id="planner-form">
        <div class="form-grid">
          <div class="two-col">
            <label>
              What year are you?
              <select name="studentYear" required>
                <option value="incoming first-year">Incoming first-year</option>
                <option value="first-year">First-year</option>
                <option value="sophomore">Sophomore</option>
                <option value="junior">Junior</option>
                <option value="senior">Senior</option>
              </select>
            </label>

            <label>
              MAT 113 or MAT 121?
              <select name="mathCognate">
                <option value="not completed or in progress">Not completed or in progress</option>
                <option value="completed MAT 113">Completed MAT 113</option>
                <option value="completed MAT 121">Completed MAT 121</option>
                <option value="currently taking MAT 113">Currently taking MAT 113</option>
                <option value="currently taking MAT 121">Currently taking MAT 121</option>
                <option value="unsure">Unsure</option>
              </select>
            </label>
          </div>

          <div class="two-col">
            <label>
              Completed ECO courses
              <input name="completedCourses" type="text" placeholder="Example: ECO 113, ECO 114">
            </label>

            <label>
              Current ECO courses
              <input name="currentCourses" type="text" placeholder="Example: ECO 213">
            </label>
          </div>

          <div class="two-col">
            <label>
              Statistics option
              <select name="statsOption">
                <option value="not completed or in progress">Not completed or in progress</option>
                <option value="completed MAT 217">Completed MAT 217</option>
                <option value="completed ECO 257">Completed ECO 257</option>
                <option value="completed PSY 217">Completed PSY 217</option>
                <option value="currently taking MAT 217">Currently taking MAT 217</option>
                <option value="currently taking ECO 257">Currently taking ECO 257</option>
                <option value="currently taking PSY 217">Currently taking PSY 217</option>
                <option value="unsure">Unsure</option>
              </select>
            </label>

            <label>
              Money/finance requirement
              <select name="financeOption">
                <option value="not completed or in progress">Not completed or in progress</option>
                <option value="completed ECO 321">Completed ECO 321</option>
                <option value="completed BUSN 323">Completed BUSN 323</option>
                <option value="currently taking ECO 321">Currently taking ECO 321</option>
                <option value="currently taking BUSN 323">Currently taking BUSN 323</option>
                <option value="unsure">Unsure</option>
              </select>
            </label>
          </div>

          <label>
            Interests or preferences
            <select name="preference">
              <option value="no stated preference">No stated preference</option>
              <option value="microeconomics">Microeconomics</option>
              <option value="macroeconomics">Macroeconomics</option>
              <option value="finance or money">Finance or money</option>
              <option value="international trade or finance">International trade or finance</option>
              <option value="environmental economics">Environmental economics</option>
              <option value="unsure">Unsure</option>
            </select>
          </label>

          <label>
            Additional notes
            <textarea name="additionalNotes" maxlength="8000" placeholder="Optional: add transfer/AP credit, course preferences, schedule concerns, or anything else the planner should know."></textarea>
            <small class="small-muted">Long notes are summarized before they are displayed back to you.</small>
          </label>
        </div>

        <div class="submit-row">
          <button type="submit">Build My EconMap</button>
        </div>
      </form>

      <div id="status" aria-live="polite"></div>
    </article>

    <section id="results" aria-live="polite"></section>
  </main>

  <script>
    const form = document.getElementById("planner-form");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderCell(items) {
      if (!Array.isArray(items) || items.length === 0) return "—";
      return items.map(item => escapeHtml(item)).join("<br>");
    }

    function renderPlan(plan) {
      const years = Array.isArray(plan.years) ? plan.years : [];
      const advisorChecks = Array.isArray(plan.advisorChecks) ? plan.advisorChecks : [];
      const globalNotes = Array.isArray(plan.globalNotes) ? plan.globalNotes : [];

      const yearHtml = years.map(year => {
        const terms = year.terms || {};
        const notes = Array.isArray(year.notes) ? year.notes : [];
        return `
          <section class="year-card">
            <h3>${escapeHtml(year.label)} — ${escapeHtml(year.academicYear)}</h3>
            <table>
              <thead>
                <tr><th>Fall</th><th>Winter</th><th>May</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td>${renderCell(terms.Fall)}</td>
                  <td>${renderCell(terms.Winter)}</td>
                  <td>${renderCell(terms.May)}</td>
                </tr>
              </tbody>
            </table>
            ${notes.map(note => `<div class="note-card"><p>${escapeHtml(note)}</p></div>`).join("")}
          </section>
        `;
      }).join("");

      const advisorHtml = advisorChecks.length
        ? `<div class="note-card"><strong>Advisor check:</strong><br>${advisorChecks.map(escapeHtml).join("<br>")}</div>`
        : "";

      const notesHtml = globalNotes.length
        ? globalNotes.map(note => `<div class="note-card"><p>${escapeHtml(note)}</p></div>`).join("")
        : "";

      return `
        <article class="result-card">
          <div class="summary-card">
            <p><strong>Assumptions & Summary</strong></p>
            <p>${escapeHtml(plan.assumptions || "Assumptions not provided.")}</p>
            ${plan.studentSummary ? `<p>${escapeHtml(plan.studentSummary)}</p>` : ""}
          </div>
          ${yearHtml}
          ${advisorHtml}
          ${notesHtml}
        </article>
      `;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "Building plan...";
      resultsEl.innerHTML = "";

      const payload = Object.fromEntries(new FormData(form).entries());

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "The planner could not build a course plan.");
        }

        statusEl.textContent = "";
        resultsEl.innerHTML = renderPlan(data.plan);
      } catch (error) {
        statusEl.textContent = error.message;
      }
    });
  </script>
</body>
</html>
